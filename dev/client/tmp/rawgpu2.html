<!doctype html><html><body>
<script type="module">
const adapter = await navigator.gpu.requestAdapter();
console.log('adapter', !!adapter, JSON.stringify({ v: adapter.info.vendor, a: adapter.info.architecture, d: adapter.info.description, fallback: adapter.info.isFallbackAdapter }));
const device = await adapter.requestDevice();
const t0 = performance.now();
device.lost.then((i) => console.log('LOST', i.reason, i.message, (performance.now() - t0).toFixed(0), 'ms'));
setTimeout(() => console.log('alive check', device.label), 3000);
// a compute op
const buf = device.createBuffer({ size: 16, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
await new Promise((r) => setTimeout(r, 500));
try { await buf.mapAsync(GPUMapMode.READ); console.log('map ok'); } catch (e) { console.log('map fail', e.message); }
</script></body></html>
