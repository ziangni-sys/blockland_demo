<!doctype html><html><body style="margin:0"><canvas id="c" width="400" height="300"></canvas>
<script type="module">
const canvas = document.getElementById('c');
const adapter = await navigator.gpu.requestAdapter();
console.log('adapter', !!adapter);
const device = await adapter.requestDevice();
let n = 0;
device.lost.then((i) => console.log('LOST', i.reason, i.message, 'frame', n));
const ctx = canvas.getContext('webgpu');
ctx.configure({ device, format: navigator.gpu.getPreferredCanvasFormat(), alphaMode: 'opaque' });
function f() {
  const enc = device.createCommandEncoder();
  const pass = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), clearValue: { r: 0.2, g: 0.5, b: 0.8, a: 1 }, loadOp: 'clear', storeOp: 'store' }] });
  pass.end();
  device.queue.submit([enc.finish()]);
  n++;
  if (n < 200) requestAnimationFrame(f); else console.log('done', n);
}
f();
</script></body></html>
