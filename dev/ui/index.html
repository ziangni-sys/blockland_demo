<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Blocklands UI harness</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1424; }
      #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #harness {
        position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 1000;
        display: flex; flex-wrap: wrap; gap: 4px; align-items: center; max-width: calc(100vw - 16px);
        padding: 6px 8px; border-radius: 8px; background: rgba(0, 0, 0, 0.78); color: #ddd;
        font: 12px/1.3 ui-monospace, monospace;
      }
      #harness button, #harness select { font: inherit; padding: 2px 6px; background: #222; color: #eee; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
      #harness .log { flex-basis: 100%; max-height: 72px; overflow: auto; white-space: pre; color: #9fd; }
      #harness[hidden] { display: none; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="ui-root"></div>
    <aside id="harness" hidden></aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
